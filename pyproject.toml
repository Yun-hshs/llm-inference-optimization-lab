[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-optimization-lab"
version = "0.1.0"
description = "Projects for LLM inference, quantization, kernels, and serving optimization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
]
torch = [
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
